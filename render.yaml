services:
  - type: web
    name: cropofriend
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: USE_MODELS
        value: "false"
      - key: RISK_SEED
        value: "26131"
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: cropofriend-db
          property: connectionString

databases:
  - name: cropofriend-db
    plan: free
